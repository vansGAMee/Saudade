name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  gcc-debug:
    name: GCC Debug + CTest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            gcc \
            g++ \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

  clang-debug:
    name: Clang Debug + CTest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            clang \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build-clang

      - name: Run CTest
        run: ctest --test-dir build-clang --output-on-failure

  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            gcc \
            g++ \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSAUDADE_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-asan

      - name: Run CTest
        run: ctest --test-dir build-asan --output-on-failure

  tsan:
    name: TSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            gcc \
            g++ \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSAUDADE_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build build-tsan

      - name: Run CTest
        run: ctest --test-dir build-tsan --output-on-failure
